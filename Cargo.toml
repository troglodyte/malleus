[package]
name = "incus-mac"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
ipnet = "2.12.0"
p256 = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0", features = ["oid"] }
thiserror = "2.0.19"
toml = "1.1.3"
x509-cert = { version = "0.3.0", features = ["builder"] }
